note: 第四个真实窗口（逻辑窗口号 W46；录制日 2026-10-23，ts 如实记录）。目的：把 real 池推向 200，并补薄分层——80 句全部取仿真库里前三个窗口没用过的句子，优先 real 池里样本最少的五个 family（缓解路径 / 数据与同意合规 / 因果链溯源 / 结论层与分层 / 出口签发闸）全取，再补高血糖与波动、低血糖安全。变体构成：original 9（P7/P8 新补的
