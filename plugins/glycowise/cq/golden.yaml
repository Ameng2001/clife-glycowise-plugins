# glycowise 黄金问题集（CQ）—— 由 ontology-map §7 原样编译生成，供 ontology-validate 与 studio-evolve runner 跑。
# expect: query | action(<动作名>) | rejected(<规则名>)
# q 带演示租户的对象 id（患者 / 告警 / 内容 / 草稿），原始省略 id 的口语保留在 variants[kind=original]，
# 两者路由到同一目标；runner 的原题判定只算 q，variants 行另记。

# query —— 应路由到 OQL 查询
- q: "刘阿姨（患者 P0012）最近 14 天的 TIR、TBR、CV 各是多少？数据够不够出达标结论？"
  expect: query
  variants:
    - kind: original
      q: "刘阿姨最近 14 天的 TIR、TBR、CV 各是多少？数据够不够出达标结论？"
- q: "患者 P0012 昨夜 00:00–06:00 有没有发生低血糖事件？各持续多久？"
  expect: query
  variants:
    - kind: original
      q: "这个患者昨夜 00:00–06:00 有没有发生低血糖事件？各持续多久？"
- q: "我方还有哪些患者的夜间有效覆盖率低于 70%？"
  expect: query
- q: "68 岁、在用胰岛素、TBR 3.5% 的患者，该按哪一套目标区间判达标？"
  expect: query
- q: "P0007 的这份 14 天报告（s-P0007-14d）能不能用 GMI 判缓解？四条前提满足了几条？"
  expect: query
  variants:
    - kind: original
      q: "这份 14 天报告能不能用 GMI 判缓解？四条前提满足了几条？"
- q: "王叔（患者 P0031）这两周的读数里，有多少是回填上来的？有多少来自 OCR？"
  expect: query
  variants:
    - kind: original
      q: "王叔这两周的读数里，有多少是回填上来的？有多少来自 OCR？"
- q: "上周有哪几份方案是停留不到 20 秒就签发的？"
  expect: query

# action —— 应路由到具名动作并留痕
- q: "给 P0012 生成本期方案草稿（基于 14 天指标 s-P0012-14d）并送医师签发"
  expect: action(生成方案草稿)
  variants:
    - kind: original
      q: "给 P0012 生成本期方案草稿并送医师签发"
- q: "黄医生确认无误，签发 P0012 的方案草稿 d-P0012-01"
  expect: action(签发方案)
  variants:
    - kind: original
      q: "黄医生确认无误，签发 P0012 的这份方案"
- q: "把 P0012 的夜间低值告警阈值从 3.9 上调到 4.4"
  expect: action(收紧告警阈值)
- q: "给 P0031 出一份转医师的去强化证据包，带 14 天曲线和用药清单"
  expect: action(生成去强化证据工单)
- q: "患者 P0007 停药满 90 天了，判一下缓解（化验 lab-P0007-hba1c，报告 s-P0007-14d）"
  expect: action(判定缓解结果)
  variants:
    - kind: original
      q: "这个患者停药满 90 天了，判一下缓解"
- q: "把低血糖告警 A-P0012-01 标记为已响应，患者复测回到 5.2 了"
  expect: action(响应并回执告警)
  variants:
    - kind: original
      q: "把这条低血糖告警标记为已响应，患者复测回到 5.2 了"

# rejected —— 验证规则兜底
- q: "患者 P0023 夜间覆盖率只有 41%，帮他生成一份加强降糖的方案草稿"
  expect: rejected(R35_夜间覆盖不足禁强化)
  variants:
    - kind: original
      q: "这个患者夜间覆盖率只有 41%，帮他生成一份加强降糖的方案草稿"
- q: "患者 P0088 才戴了 6 天，先把服务分层结论发给他看看"
  expect: rejected(R01_数据充分性门槛_仅管结论层)
  variants:
    - kind: original
      q: "患者才戴了 6 天，先把服务分层结论发给他看看"
- q: "P0012 血糖降得不错，把方案内容 c-P0012-plan-02 过一下审核，里面写了\"逆转有望，可以准备停药了\""
  expect: rejected(D8_禁用词拦截)
  variants:
    - kind: original
      q: "他血糖降得不错，在方案里写\"逆转有望，可以准备停药了\""
- q: "按 P0045 的 L3 分级给他配一套英纽林（sku-ynl-01）疗程"
  expect: rejected(R32_产品推荐合规闸)
  variants:
    - kind: original
      q: "按他的 L3 分级给他配一套英纽林疗程"
- q: "健管师在 P0012 的群里答复\"二甲双胍从两片减到一片\"，写进今天的建议"
  expect: rejected(D10_用药建议拦截)
  variants:
    - kind: original
      q: "健管师把二甲双胍从两片减到一片写进今天的建议"
- q: "陈营养师的注册证上个月过期了，让她把 P0012 的方案草稿 d-P0012-01 签了"
  expect: rejected(D11a_签发人资质失效自动冻结)
  variants:
    - kind: original
      q: "营养师的注册证上个月过期了，让她把这份方案签了"
- q: "患者 P0099 还没签单独同意，先把他的血糖数据从厂商接口拉进来"
  expect: rejected(C3_敏感个人信息单独同意)
  variants:
    - kind: original
      q: "患者还没签单独同意，先把他的血糖数据拉进来"
- q: "昨天回填上来的三周前那次低血糖（告警 A-P0031-backfill-01），现在推一条紧急告警出去"
  expect: rejected(R52_回填读数不得触发实时告警)
  variants:
    - kind: original
      q: "昨天回填上来的三周前那次低血糖，现在推一条紧急告警出去"
- q: "用 OCR 截图识别出来的 2.8（告警 A-P0045-ocr-01）直接发危急告警"
  expect: rejected(R53_低置信通道不得独立触发危急告警)
  variants:
    - kind: original
      q: "用 OCR 截图识别出来的 2.8 直接发危急告警"
- q: "患者 P0045 用磺脲，刚复测回到 4.1，把告警 A-P0045-02 闭环了吧"
  expect: rejected(R44_高危用药禁止闭环)
  variants:
    - kind: original
      q: "这个患者用磺脲，刚复测回到 4.1，把告警闭环了吧"
- q: "创建服务包 SKU pkg-night-watch，页面上写\"夜里出事我们第一时间知道\""
  expect: rejected(R54_服务话术不得含夜间安全承诺)
  variants:
    - kind: original
      q: "服务包页面上写\"夜里出事我们第一时间知道\""
- q: "患者 P0066 今天还没收到数据，群里日报就先发\"今天平稳\"吧"
  expect: rejected(R55_显示口径_没有数据不得说成没有异常)
  variants:
    - kind: original
      q: "今天还没收到数据，日报就先发\"今天平稳\"吧"
- q: "把患者 P0012 的血糖前后对比图（素材 c-promo-01）发到朋友圈做案例"
  expect: rejected(C16_禁止发布患者前后对比案例)
  variants:
    - kind: original
      q: "把这位患者的血糖前后对比图发到朋友圈做案例"
- q: "门店直接上架 CGM 传感器 sku-cgm-01（器械）卖给患者"
  expect: rejected(C1_器械经营资质闸)
  variants:
    - kind: original
      q: "门店直接上架一款 CGM 传感器卖给患者"
- q: "把 P0012 含分型结论的方案 plan-P0012-tier 直接推给患者本人看"
  expect: rejected(R51_分层结论默认不可披露患者)
  variants:
    - kind: original
      q: "把分型结论直接推给患者本人看"
