# 控糖场景本体插件清单（plugin.yaml）
#
# 这是哪一类插件（本仓库有两类，别混）：
#   kind: onto-engine —— clife-onto-engine 的 Python 本体插件，由 /studio-ontology:compile 从五要素 IR
#     编译而来，在引擎仓库内被加载，填满 Object/Link/Function/Rule/Action/Mapping/CQ 七个 SPI 槽位。
#   另一类是 glycowise-compliance/ 等四个 studio 的 Claude Code 技能插件（skill-map 的产物，尚未生成），
#     它们是 skill/agent 包，不是本体插件，与本目录不共享代码、不互相 import。
#
# schema(槽位1)/function·rule·action(槽位3/4)/CQ(槽位7) 用 Python 声明（__init__.py，本清单不重复）；
# mappings(槽位2) 由 __init__.py 末尾的 spi.load_mappings 自行加载；
# 此处补齐声明式的槽位 5（术语表）/ 6（复核角色）。加载：spi.load_manifest(此文件)。

plugin: glycowise
ontology: glycowise          # 引擎 load_manifest 硬读此键，不可写成 ontology_id
